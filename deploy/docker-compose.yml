# CineCards game server. The Cloudflare Tunnel (sevend-io-stream) routes
# cinecards.sevend.io -> http://localhost:2567, so the server binds host loopback
# only. No public port is exposed; HTTPS/WSS terminate at Cloudflare's edge.
services:
  server:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - '127.0.0.1:2567:2567'
    # accounts database (DATA_DIR=/app/data, story 8.1): survives rebuilds; never `docker compose down -v`
    volumes:
      - cinecards-data:/app/data

volumes:
  cinecards-data:
