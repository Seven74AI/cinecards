<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Alegreya:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0c0703}
.canvas{display:flex;gap:40px;align-items:flex-start;padding:40px;box-sizing:border-box;background:#0c0703;width:max-content}
.lbl{font-family:Cinzel,serif;font-size:12px;letter-spacing:.14em;color:#d4a74a;text-transform:uppercase;margin:0 0 10px}
.phone{--pw:390px;--ph:844px;width:var(--pw);height:var(--ph);box-sizing:border-box;overflow:hidden;position:relative;display:flex;flex-direction:column;color:#ead9b0;background:radial-gradient(ellipse at 50% 30%,#3a2414 0%,#2b1b10 45%,#120a05 100%);font-family:Alegreya,serif}
.phone.sm{--pw:360px;--ph:640px}
.phone *{box-sizing:border-box}
button{font:inherit;color:inherit}
.top{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 2px}
.ib{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px}
.name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:8px;background:rgba(20,12,6,.55);box-shadow:inset 0 0 0 1px rgba(212,167,74,.3)}
.name input{flex:1;min-width:0;border:0;background:transparent;font-family:Cinzel,serif;font-weight:700;font-size:14px;color:#f2d27a;outline:0;padding:0;text-overflow:ellipsis}
.btn{height:44px;padding:0 14px;border:0;border-radius:10px;font-family:Cinzel,serif;font-weight:900;font-size:12px;letter-spacing:.02em;cursor:pointer;flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{color:#2a1a0e;background:linear-gradient(#f2d27a,#c08a2a);box-shadow:0 0 0 1px #5a3d12,0 2px 6px rgba(0,0,0,.5)}
.btn.ghost{color:#f2d27a;background:rgba(20,12,6,.6);box-shadow:inset 0 0 0 1px rgba(212,167,74,.5)}
.btn.red{color:#fff3d6;background:radial-gradient(circle at 40% 35%,#c0392b,#7a1414 70%);box-shadow:0 0 0 2px #4d0c0a}
.meta{font-family:Alegreya,serif;font-size:12px;color:#b9a27a}
.err{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-family:Alegreya,serif;font-weight:500;font-size:13px;color:#ffd6cc;background:rgba(142,31,31,.55);box-shadow:inset 0 0 0 1px rgba(255,120,100,.55);white-space:nowrap}
.okp{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-family:Alegreya,serif;font-weight:500;font-size:13px;color:#d4f5dc;background:rgba(29,106,54,.5);box-shadow:inset 0 0 0 1px rgba(90,200,120,.55);white-space:nowrap}
.count{font-family:Cinzel,serif;font-weight:900;font-size:22px;color:#f2d27a;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.count small{font-size:14px;color:#b9a27a}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(212,167,74,.3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c08a2a,#f2d27a)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:22px;background:rgba(20,12,6,.6);box-shadow:inset 0 0 0 1px rgba(212,167,74,.35);font-family:Alegreya,serif;font-size:15px;color:#8a7658}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:22px;border:0;font-family:Alegreya,serif;font-weight:500;font-size:14px;color:#ead9b0;background:rgba(20,12,6,.6);box-shadow:inset 0 0 0 1px rgba(212,167,74,.35);white-space:nowrap;cursor:pointer}
.chip.on{color:#2a1a0e;background:linear-gradient(#f3e6c4,#d9c08a);box-shadow:0 0 0 1px #d4a74a}
.chip.sq{width:44px;padding:0;justify-content:center}
.chip.small{height:32px;padding:0 10px;font-size:13px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.hscroll::-webkit-scrollbar{display:none}
.sec{font-family:Cinzel,serif;font-weight:700;font-size:12px;letter-spacing:.08em;color:#d4a74a;text-transform:uppercase}
/* card (same markup as docs/design/mobile-table) */
.c{position:relative;flex:none;width:var(--w);height:calc(var(--w) * 1.4);padding:2px;border-radius:5px;background:linear-gradient(145deg,#f2d27a,#d4a74a 40%,#8a6416 75%,#f2d27a);box-shadow:0 0 0 1px #3a2608,0 3px 6px rgba(0,0,0,.6)}
.c .in{height:100%;border-radius:3px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(90,61,12,.5);background:radial-gradient(ellipse at 50% 40%,#f3e6c4,#ead9b0 60%,#cdb07a)}
.c.p-spell .in{background:radial-gradient(ellipse at 50% 35%,#f6dcc8,#e8c0a6 60%,#c08e72)}
.c.p-equip .in{background:radial-gradient(ellipse at 50% 35%,#eef1ef,#d6dbd6 60%,#a9b0ab)}
.c.p-terr .in{background:radial-gradient(ellipse at 50% 35%,#eef0cf,#d8ddb0 60%,#a9b37a)}
.c .nm{flex:none;font-family:Cinzel,serif;font-weight:900;font-size:max(8px,calc(var(--w) * .1));line-height:1.05;color:#2a1a0e;text-align:center;padding:4px 3px 3px calc(var(--w) * .22);height:calc(var(--w) * .34);display:flex;align-items:center;justify-content:center;overflow:hidden}
.c .nm.nm-s{font-size:max(7px,calc(var(--w) * .082));letter-spacing:-.02em}
.c .nm span{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c .art{flex:1;margin:0 3px 3px;border-radius:2px;border:1px solid #8a6416}
.c .st{position:absolute;left:2px;right:2px;bottom:2px;display:flex;justify-content:space-between}
.c .st span{font-family:Cinzel,serif;font-weight:900;font-size:max(9px,calc(var(--w) * .12));color:#fff;padding:0 3px;border-radius:2px 2px 5px 5px;box-shadow:0 0 0 1px #f2d27a;line-height:1.35}
.c .a{background:linear-gradient(#b8322a,#7a1414)}.c .h{background:linear-gradient(#8a3cb0,#4e1670)}
.r1 .in{border:1.5px solid #2f7bf6}.r2 .in{border:1.5px solid #b020c0;box-shadow:inset 0 0 8px rgba(176,32,192,.4)}
.c.r3{background:linear-gradient(145deg,#fff2c0,#ffb54a 30%,#d4a74a 55%,#8a6416 80%,#fff2c0);box-shadow:0 0 0 1px #3a2608,0 0 9px rgba(255,149,0,.55)}.r3 .in{border:1.5px solid #ff9500}
/* cost token by category (card-frames D) */
.tk{position:absolute;top:-4px;left:-4px;width:calc(var(--w) * .3);height:calc(var(--w) * .34);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tk i,.tk b{position:absolute;inset:0;font-style:normal}
.tk i{background:linear-gradient(145deg,#fff4c4,#d4a74a 45%,#7a5410)}
.tk b{inset:1.5px;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:max(9px,calc(var(--w) * .15));color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.7)}
.tk.tkl{position:relative;top:auto;left:auto;flex:none;display:inline-block;width:var(--s);height:calc(var(--s) * 1.12)}
.tk.tkl b{font-size:calc(var(--s) * .5)}
.shield i,.shield b{clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}
.shield b{background:linear-gradient(#e9c25d,#9a6a14);color:#3a2608;text-shadow:none;padding-bottom:22%}
.seal i{border-radius:47% 53% 50% 50% / 53% 47% 53% 47%;background:#5a0f0d}
.seal b{border-radius:50%;inset:3px;background:radial-gradient(circle at 40% 35%,#e0574a,#a3271f 55%,#5a0f0d)}
.hex i,.hex b{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.hex b{background:linear-gradient(145deg,#9aa8b4,#4a5662 60%,#2f3943)}
.dia i,.dia b{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dia b{inset:3px;background:linear-gradient(160deg,#7fb84a,#3e7a1c 55%,#1d3a0c)}
.gem{display:inline-block;flex:none;width:9px;height:9px;transform:rotate(45deg);--rc:#b8bcc4;background:linear-gradient(135deg,#fff 0%,var(--rc) 35%,var(--rc) 70%,#000 140%);box-shadow:0 0 0 1.5px #d4a74a,0 0 6px var(--rc)}
.g-common{--rc:#b8bcc4;box-shadow:0 0 0 1.5px #d4a74a}.g-rare{--rc:#2f7bf6}.g-epic{--rc:#b020c0}.g-legendary{--rc:#ff9500}
/* deck badges on cards */
.badge{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.badge.bin{color:#2a1a0e;background:linear-gradient(#f2d27a,#c08a2a);box-shadow:0 0 0 2px #2a1a0e,0 2px 4px rgba(0,0,0,.6)}
.badge.badd{color:#f2d27a;background:rgba(20,12,6,.85);box-shadow:0 0 0 1.5px rgba(212,167,74,.7)}
.cbtn .c .nm{padding-right:calc(var(--w) * .2)}
.used{opacity:.55;filter:saturate(.6)}
.toast{position:absolute;left:12px;right:12px;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:10px;font-family:Alegreya,serif;font-size:14px;line-height:1.25;color:#ffe9e2;background:linear-gradient(#7a1414,#4d0c0a);box-shadow:0 0 0 1.5px #d4a74a,0 8px 18px rgba(0,0,0,.6);z-index:5}
.toast b{font-family:Cinzel,serif;font-weight:900;font-size:13px;display:block;color:#fff3d6}
.curve{display:flex;align-items:flex-end;gap:2px;margin-bottom:12px;flex:none}
.curve span{position:relative;width:8px;background:linear-gradient(#f2d27a,#8a6416);border-radius:1px 1px 0 0}
.curve em{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-style:normal;font-family:Cinzel,serif;font-size:8px;color:#8a7658}
.scrollhint{position:absolute;right:3px;width:4px;border-radius:2px;background:rgba(212,167,74,.45)}

.dpanel{flex:none;margin:0 10px;padding:8px 10px 6px;border-radius:12px;background:rgba(20,12,6,.6);box-shadow:0 0 0 1px rgba(212,167,74,.35)}
.drow{display:flex;align-items:center;gap:10px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 2px;-webkit-mask:linear-gradient(90deg,#000 90%,transparent);mask:linear-gradient(90deg,#000 90%,transparent)}
.strip::-webkit-scrollbar{display:none}
.tile{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:0;cursor:pointer}
.tile .cap{width:56px;font-family:Alegreya,serif;font-size:11px;line-height:1.1;color:#ead9b0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .rm{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffe9e2;background:#7a1414;box-shadow:0 0 0 1.5px #d4a74a;z-index:2}
.filters{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 10px 0}
.colhead{flex:none;display:flex;align-items:baseline;gap:8px;padding:8px 12px 4px}
.grid{flex:1;min-height:0;overflow:hidden;position:relative;padding:6px 10px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;align-content:start;justify-items:center}
.phone.sm .grid{gap:10px 6px}
.cbtn{position:relative;border:0;background:transparent;padding:0;cursor:pointer}
.toggle{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-family:Alegreya,serif;font-size:12px;color:#b9a27a;margin-left:auto}
.sw{width:30px;height:18px;border-radius:9px;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(212,167,74,.5);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#8a7658}
.mini-nostat .st{display:none}

</style>
</helmet>
